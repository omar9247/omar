<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="glow-bone" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="none"/>

  <!-- Pelvic Girdle Arch -->
  <path d="M 120 70 C 120 40, 280 40, 280 70 C 270 120, 230 130, 200 130 C 170 130, 130 120, 120 70 Z"
        fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="160" cy="85" r="14" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <circle cx="240" cy="85" r="14" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>

  <!-- Bilateral Femur (Cortical Bone Architecture) -->
  <!-- Left Femur -->
  <path d="M 150 120 L 140 250 L 130 265 L 155 265 L 160 250 L 170 120 Z"
        fill="rgba(248, 250, 252, 0.15)" stroke="#F8FAFC" stroke-width="2" filter="url(#glow-bone)"/>
  <!-- Right Femur -->
  <path d="M 230 120 L 240 250 L 245 265 L 270 265 L 260 250 L 250 120 Z"
        fill="rgba(248, 250, 252, 0.15)" stroke="#F8FAFC" stroke-width="2" filter="url(#glow-bone)"/>

  <!-- Trabecular Bone Mineral Density Lattice (NTX Resorption Zone) -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.5" stroke-dasharray="2 2">
    <line x1="145" y1="130" x2="165" y2="130"/>
    <line x1="143" y1="160" x2="167" y2="160"/>
    <line x1="141" y1="190" x2="165" y2="190"/>
    <line x1="139" y1="220" x2="161" y2="220"/>

    <line x1="235" y1="130" x2="255" y2="130"/>
    <line x1="233" y1="160" x2="257" y2="160"/>
    <line x1="235" y1="190" x2="259" y2="190"/>
    <line x1="239" y1="220" x2="261" y2="220"/>
  </g>

  <!-- Patellofemoral Knee Joints & Caliper Brackets -->
  <circle cx="145" cy="280" r="12" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="255" cy="280" r="12" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="145" cy="280" r="4" fill="#38BDF8"/>
  <circle cx="255" cy="280" r="4" fill="#38BDF8"/>

  <!-- Tibia / Fibula Traces -->
  <line x1="145" y1="295" x2="140" y2="380" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
  <line x1="255" y1="295" x2="260" y2="380" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
  <line x1="132" y1="305" x2="128" y2="375" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="268" y1="305" x2="272" y2="375" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Biomechanical Force Vector Indicator -->
  <g stroke="#10B981" stroke-width="1.5">
    <line x1="200" y1="20" x2="200" y2="100" stroke-dasharray="4 4"/>
    <polygon points="195,95 200,105 205,95" fill="#10B981"/>
  </g>
</svg>
