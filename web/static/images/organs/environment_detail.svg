<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="glow-env" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="none"/>

  <!-- Habitat Atmospheric Shell / Pressure Hull Geometry -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="200" cy="200" r="140" fill="rgba(56, 189, 248, 0.08)" stroke="#38BDF8" stroke-width="1.2"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Atmospheric Gas Scrubbing Ring / ECLSS Vortex -->
  <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#glow-env)">
    <path d="M 120 160 A 90 90 0 0 1 280 160"/>
    <path d="M 280 240 A 90 90 0 0 1 120 240"/>
  </g>

  <!-- Cabin CO2 Molecular Sensors (Carbonic Partial Pressure Array) -->
  <g fill="#F59E0B" filter="url(#glow-env)">
    <circle cx="160" cy="180" r="6"/>
    <circle cx="240" cy="180" r="6"/>
    <circle cx="200" cy="225" r="7"/>
  </g>
  <g stroke="#F59E0B" stroke-width="1.2" opacity="0.8">
    <line x1="160" y1="180" x2="200" y2="225"/>
    <line x1="240" y1="180" x2="200" y2="225"/>
    <line x1="160" y1="180" x2="240" y2="180"/>
  </g>

  <!-- Galactic Cosmic Radiation (GCR) Flux Detection Vectors -->
  <g stroke="#EF4444" stroke-width="1.5" stroke-linecap="round">
    <line x1="40" y1="60" x2="110" y2="110"/>
    <polygon points="105,100 115,114 100,112" fill="#EF4444"/>

    <line x1="360" y1="60" x2="290" y2="110"/>
    <polygon points="300,112 285,114 295,100" fill="#EF4444"/>

    <line x1="40" y1="340" x2="110" y2="290"/>
    <polygon points="100,288 115,286 105,300" fill="#EF4444"/>
  </g>

  <!-- Ambient Sensor Caliper Crosshairs -->
  <line x1="200" y1="15" x2="200" y2="35" stroke="#38BDF8" stroke-width="2"/>
  <line x1="200" y1="365" x2="200" y2="385" stroke="#38BDF8" stroke-width="2"/>
  <line x1="15" y1="200" x2="35" y2="200" stroke="#38BDF8" stroke-width="2"/>
  <line x1="365" y1="200" x2="385" y2="200" stroke="#38BDF8" stroke-width="2"/>
</svg>
